name: clever_portfolio
description: "Ahmed Maher — Senior Flutter Engineer. Personal portfolio (Flutter Web)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.7
  # Floor matches CI (.github/workflows/deploy.yml). Fails `pub get` fast on an
  # older local SDK instead of a cryptic flutter_test/engine mismatch.
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter

  # Clean web URLs (PathUrlStrategy) — Flutter SDK package.
  flutter_web_plugins:
    sdk: flutter

  # State management (BLoC/Cubit) — all cubits extend core/abstract/BaseCubit<T>.
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

  # Functional error handling — Either<Failure, T> across every repo + use case.
  dartz: ^0.10.1

  # HTTP client — wired in DioClient, reserved for the contact form + future remote content.
  dio: ^5.11.1

  # Responsive sizing (the mandated "sizeHelper") — .w / .h / .sp / .r behind core/responsive/.
  flutter_screenutil: ^5.9.3

  # Dependency injection.
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Routing — single '/' route + smooth-scroll anchors; clean web URLs.
  go_router: ^18.1.3

  # Localization — en.json + ar.json, RTL first-class.
  easy_localization: ^3.0.8

  # Open store / mailto / tel / CV links.
  url_launcher: ^6.3.3

  # Vector assets (store badges, icons).
  flutter_svg: ^2.3.2

  # Motion — entrance/scroll animations (reduced-motion gated).
  flutter_animate: ^4.5.2
  visibility_detector: ^0.4.0+2

  # Local persistence — ThemeMode + Locale.
  shared_preferences: ^2.5.6

  # Codegen annotations — Freezed unions (states/models) + JSON serialization.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Value equality for pure domain entities + Failures.
  equatable: ^3.0.0

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints (house standard).
  flutter_lints: ^6.0.0

  # Code generation — freezed + json_serializable + injectable, all via build_runner.
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  injectable_generator: ^3.1.3

  # Testing.
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/docs/
    - assets/translations/
    - assets/data/
    - assets/images/
    - assets/images/projects/
    # - assets/icons/   # store-badge SVGs (added in M4)

  # Typography — bundled rather than fetched via google_fonts at runtime. Each
  # GoogleFonts.* call downloaded its face from gstatic AFTER main.dart.js had
  # executed, and every completion posted `fontsChanged`, invalidating the text
  # layout cache across a ~13,000px scroll view. These are the Google Fonts
  # latin subsets (~66 KB vs ~303 KB for the full faces google_fonts served).
  # Licenses: assets/fonts/OFL-*.txt (SIL Open Font License 1.1).
  #
  # Only the weights the type scale actually uses are shipped. Adding a new
  # weight to AppTypography means adding the matching .ttf here.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
    # Brand glyphs (GitHub / LinkedIn / X / WhatsApp / App Store / Google Play).
    # Replaces the font_awesome_flutter package, which also declared Free-Regular
    # (86 KB) and Free-Solid (401 KB) — neither of which this app referenced, and
    # the icon tree-shaker leaves an unreferenced family untouched, so both
    # shipped whole on the pre-first-frame path. Codepoints in
    # lib/core/constants/app_icons.dart. License: assets/fonts/LICENSE-fontawesome.txt
    - family: FontAwesomeBrands
      fonts:
        - asset: assets/fonts/Font-Awesome-7-Brands-Regular-400.otf
          weight: 400
